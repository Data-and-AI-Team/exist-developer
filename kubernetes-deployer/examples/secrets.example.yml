apiVersion: v1
kind: Secret
metadata:
  name: dksh-registry-secret
  namespace: dksh
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: >-
    {"auths":{"ghcr.io":{"username":"REPLACE_WITH_GITHUB_USERNAME","password":"REPLACE_WITH_GITHUB_TOKEN_WITH_READ_PACKAGES","auth":"REPLACE_WITH_BASE64_USERNAME_COLON_TOKEN"}}}
---
apiVersion: v1
kind: Secret
metadata:
  name: presales-automation-secrets
  namespace: presales-automation
type: Opaque
stringData:
  POSTGRES_DB: "REPLACE_WITH_POSTGRES_DATABASE_NAME"
  POSTGRES_USER: "REPLACE_WITH_POSTGRES_ADMIN_USERNAME"
  POSTGRES_PASSWORD: "REPLACE_WITH_POSTGRES_ADMIN_PASSWORD"
  POSTGRES_NON_ROOT_USER: "REPLACE_WITH_POSTGRES_APPLICATION_USERNAME"
  POSTGRES_NON_ROOT_PASSWORD: "REPLACE_WITH_POSTGRES_APPLICATION_PASSWORD"
  MINIO_ROOT_USER: "REPLACE_WITH_MINIO_ROOT_USERNAME"
  MINIO_ROOT_PASSWORD: "REPLACE_WITH_MINIO_ROOT_PASSWORD"
  OPENAI_API_KEY: "REPLACE_WITH_OPENAI_API_KEY"
  AZURE_OPENAI_API_KEY: "REPLACE_WITH_AZURE_OPENAI_API_KEY"